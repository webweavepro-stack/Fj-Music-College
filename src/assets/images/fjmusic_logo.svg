    <rect x="185" y="24" width="7.2" height="80" rx="3.6" fill="#D15F15" />
  </g>

  <!-- Head Profile Silhouette -->
  <path
    d="M 23 104
       L 186 104
       C 186 104 184 114 181 117
       C 178 120 180 126 186 135
       C 188 138 188 141 184 143
       C 180 145 178 147 181 151
       C 183 154 182 157 177 158
       C 175 159 176 163 179 167
       C 181 171 181 176 177 179
       C 173 183 162 188 152 195
       C 144 201 138 210 133 218
       L 76 218
       C 76 218 64 200 58 184
       C 52 168 47 152 46 138
       C 45 125 43 113 41 106
       Z"
    fill="#000000"
  />

  <!-- Headphone Band (Back of neck/head) -->
  <path
    d="M 40 108
       C 37 118 36 135 39 156
       C 42 175 51 192 63 204
       C 67 200 68 194 65 186
       C 55 174 48 158 46 142
       C 44 128 46 116 48 108
       Z"
    fill="#000000"
  />

  <!-- Headphone Ear Cup Assembly -->
  <!-- Outer Cup Black Border -->
  <circle cx="88" cy="148" r="38" fill="#000000" />
  <!-- White Cushion Ring -->
  <circle cx="88" cy="148" r="32" fill="#FFFFFF" />
  <!-- Inner Ring Black -->
  <circle cx="88" cy="148" r="22" fill="#000000" />
  <!-- Center White Hole / Driver Port -->
  <circle cx="88" cy="148" r="12" fill="#FFFFFF" />
  <!-- Central Pin -->
  <circle cx="88" cy="148" r="5" fill="#000000" />

  <!-- Logotype Typography: FJMUSIC COLLEGE -->
  <!-- Top line: FJMUSIC -->
  <text
    x="215"
    y="112"
    fill="#000000"
    font-family="Poppins, 'Montserrat', 'Inter', -apple-system, sans-serif"
    font-size="78"
    font-weight="900"
    letter-spacing="-0.035em"
  >FJMUSIC</text>

  <!-- Bottom line: COLLEGE -->
  <text
    x="215"
    y="184"
    fill="#000000"
    font-family="Poppins, 'Montserrat', 'Inter', -apple-system, sans-serif"
    font-size="75"
    font-weight="900"
    letter-spacing="0.042em"
  >COLLEGE</text>
</svg>
